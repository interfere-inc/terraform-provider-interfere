provider:
  name: "interfere"
resources:
  service:
    create:
      path: "/v3/workspaces/{workspaceSlug}/actions/services.setWebsiteSettings"
      method: "POST"
    read: &service_read
      path: "/v3/workspaces/{workspaceSlug}/queries/services.byId"
      method: "POST"
    schema: &service_schema
      ignores:
        [
          "args",
          "success",
          "organizationId",
          "resource",
          "connectionId",
          "destinationResource",
          "sourceDatasourceId",
          "sourceWorkingDirectory",
          "reportableEnvironment",
          "typeSource",
          "createdAt",
          "updatedAt",
          "lastSeenAt",
          "firstTelemetryAt",
          "pausedAt",
          "archivedAt",
        ]
      attributes:
        overrides:
          id:
            description: "Unique service identifier. Applying adopts this existing service."
          name:
            description: "Telemetry service name."
          namespace:
            description: "Telemetry service namespace, when supplied."
          type:
            description: "Service type: unclassified, other, backend, or website."
          websiteSettings:
            description: "Service-owned website settings. Omit to preserve the stored settings."
  workspace:
    create:
      path: "/v3/workspaces/{workspaceSlug}/actions/workspaces.updateBasics"
      method: "POST"
    read: &workspace_read
      path: "/v3/workspaces/{workspaceSlug}/queries/workspaces.current"
      method: "POST"
    schema: &workspace_schema
      ignores:
        [
          "args",
          "success",
          "slug",
          "autoAssignProblems",
          "autoCreateApps",
          "defaultWebsiteSettings",
          "defaultSurfaceId",
          "clerkOrgId",
          "clerkUpdatedAt",
          "demoResetAt",
          "demoResetStatus",
          "demoWorkspace",
          "environmentFiltering",
          "imageUrl",
          "onboardingCompletedAt",
          "residencyPolicy",
          "stripeCustomerId",
          "createdAt",
          "deletedAt",
          "updatedAt",
        ]
      attributes:
        overrides:
          id:
            description: "Unique workspace identifier."
          name:
            description: "Display name of the workspace."
          dataResidencyLocation:
            description: "Region where workspace data is stored. Set when the workspace is created."
          allowMemberWorkspaceCreation:
            description: "Whether workspace members can create additional workspaces."
          enabledAuthMethods:
            description: "Sign-in methods members can use: enterprise_sso, oauth_google, oauth_github, oauth_vercel, passkey, email_code, and password. Must include passkey and email_code. Null means the workspace uses the default methods."
          impersonationGranted:
            description: "Whether Interfere support may access the workspace by impersonation."
          impersonationExpiresAt:
            description: "When support access ends, in Unix milliseconds. Null keeps access until it is turned off."
  private_key:
    create:
      path: "/v3/workspaces/{workspaceSlug}/api-keys"
      method: "POST"
    read:
      path: "/v3/workspaces/{workspaceSlug}/api-keys/{apiKeyId}"
      method: "GET"
    schema:
      ignores: ["revoked", "apiKey.id", "apiKey.name", "surfaceSlug"]
      attributes:
        aliases:
          apiKeyId: "id"
  public_key:
    create:
      path: "/v3/workspaces/{workspaceSlug}/publicKeys"
      method: "POST"
    read:
      path: "/v3/workspaces/{workspaceSlug}/publicKeys/{publicKeyId}"
      method: "GET"
    schema:
      ignores: ["revoked"]
      attributes:
        aliases:
          publicKeyId: "id"
  tracking_domain:
    create:
      path: "/v3/workspaces/{workspaceSlug}/actions/workspaces.addProxyDomain"
      method: "POST"
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/domains.byIdIncludeDeleted"
      method: "POST"
    schema:
      ignores:
        [
          "args",
          "success",
          "type",
          "deletedAt",
          "domainMetadata.cfHostnameId",
          "domainMetadata.lastError",
          "domainMetadata.provider",
          "affiliationEmailAddress",
          "clerkDomainId",
          "enrollmentMode",
          "organizationId",
          "ownershipVerifiedAt",
          "verifiedAt",
          "createdAt",
          "updatedAt",
        ]
      attributes:
        overrides:
          id:
            description: "Unique tracking domain identifier."
          name:
            description: "Lowercase fully qualified tracking hostname, without a trailing dot."
          status:
            description: "Current hostname verification status."
  network_rules:
    create:
      path: "/v3/workspaces/{workspaceSlug}/network/rules"
      method: "PUT"
    read:
      path: "/v3/workspaces/{workspaceSlug}/network/rules"
      method: "GET"
    schema:
      ignores: ["success", "rules.id"]
  verified_domain:
    create:
      path: "/v3/workspaces/{workspaceSlug}/actions/workspaces.addDomain"
      method: "POST"
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/domains.forOrg"
      method: "POST"
    schema:
      ignores: ["success"]
      attributes:
        overrides:
          args.id:
            description: "Unique verified domain identifier."
          args.name:
            description: "Lowercase email domain, such as example.com."
  scim_group_role_mappings:
    create:
      path: "/v3/workspaces/{workspaceSlug}/actions/workspaces.reorderScimGroupRoles"
      method: "POST"
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/scimGroups.forOrg"
      method: "POST"
    schema:
      ignores: ["success", "args.ids"]
      attributes:
        overrides:
          args.clerkScimDirectoryId:
            description: "Identifier of the SCIM directory whose group role mappings this resource manages."
data_sources:
  service:
    read: *service_read
    schema: *service_schema
  services:
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/services.forWorkspace"
      method: "POST"
    schema:
      ignores:
        [
          "args",
          "organizationId",
          "resource",
          "connectionId",
          "destinationResource",
          "sourceDatasourceId",
          "sourceDatasource",
          "sourceWorkingDirectory",
          "reportableEnvironment",
          "typeSource",
          "createdAt",
          "updatedAt",
          "lastSeenAt",
          "firstTelemetryAt",
          "pausedAt",
          "archivedAt",
          "websiteSettings",
        ]
      attributes:
        overrides:
          services.id:
            description: "Unique service identifier."
          services.name:
            description: "Telemetry service name."
          services.namespace:
            description: "Telemetry service namespace, when supplied."
          services.type:
            description: "Service type: unclassified, other, backend, or website."
  workspace:
    read: *workspace_read
    schema: *workspace_schema
  public_keys:
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/publicKeys.forWorkspace"
      method: "POST"
    schema:
      ignores:
        [
          "createdAt",
          "deletedAt",
          "updatedAt",
          "lastUsedAt",
          "surfaceId",
          "organizationId",
        ]
      attributes:
        overrides:
          public_keys.id:
            description: "Unique public key identifier."
          public_keys.name:
            description: "Display name of the public key."
          public_keys.content:
            description: "Publishable browser credential. It is not a secret."
  tracking_domain:
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/domains.forOrg"
      method: "POST"
    schema:
      ignores:
        [
          "affiliationEmailAddress",
          "clerkDomainId",
          "createdAt",
          "deletedAt",
          "domainMetadata.cfHostnameId",
          "domainMetadata.lastError",
          "domainMetadata.provider",
          "enrollmentMode",
          "organizationId",
          "ownershipVerifiedAt",
          "type",
          "updatedAt",
          "verifiedAt",
        ]
      attributes:
        overrides:
          tracking_domain.id:
            description: "Unique tracking domain identifier."
          tracking_domain.name:
            description: "Lowercase fully qualified tracking hostname, without a trailing dot."
          tracking_domain.status:
            description: "Current hostname verification status."
  integration:
    read:
      path: "/v3/workspaces/{workspaceSlug}/queries/integrations.installations"
      method: "POST"
    schema:
      ignores:
        [
          "enabledByUserId",
          "externalAccountId",
          "organizationId",
          "providerMetadata",
          "statusReason",
          "createdAt",
          "deletedAt",
          "updatedAt",
          "enabledBy",
        ]
      attributes:
        overrides:
          integration.id:
            description: "Unique integration installation identifier."
          integration.provider:
            description: "Installed integration provider."
          integration.status:
            description: "Current integration installation status."
