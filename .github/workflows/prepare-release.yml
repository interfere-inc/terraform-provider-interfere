name: Prepare release
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'interfere-inc/terraform-provider-interfere' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - run: echo "SCHEMA_FILE=$RUNNER_TEMP/terraform-openapi.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Detect API changes and pending changesets
        id: changes
        run: bun scripts/check-release.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.changes.outputs.needed == 'true'
        with:
          go-version: "1.26.8"
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        if: steps.changes.outputs.needed == 'true'
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.changes.outputs.needed == 'true'
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        if: steps.changes.outputs.needed == 'true'
        with:
          script: bun run release:prepare
          commit-message: "chore: prepare Terraform provider release"
          pr-title: "chore: release Terraform provider"
      - name: Run checks on the bot branch
        if: steps.changes.outputs.needed == 'true'
        run: gh workflow run check.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
