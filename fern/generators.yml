api:
  auth: endpoint-security
  specs:
    - openapi: ../openapi.json
default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.2
        output:
          location: local-file-system
          path: ../internal/sdk
        config:
          packageName: sdk
          importPath: github.com/interfere-inc/terraform-provider-interfere/internal/sdk
          alwaysSendRequiredProperties: true
          maxRetries: 0
